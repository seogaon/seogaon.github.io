<style>
:root{--bg:#F4F6FB;--surface:#FFFFFF;--ink:#1F2A44;--muted:#5E6882;--line:#E1E5EF;--accent:#3470E8;--hl:#FFF4D6;
  --body:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--display:'Jua','Pretendard',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A28;--surface:#1E2638;--ink:#EEF1F8;--muted:#A3ACC2;--line:#2C3549;--accent:#7EA6FF;--hl:#3A3322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A28;--surface:#1E2638;--ink:#EEF1F8;--muted:#A3ACC2;--line:#2C3549;--accent:#7EA6FF;--hl:#3A3322;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:680px;margin:0 auto;padding-inline:20px;padding-block:calc(56px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;margin:0 0 20px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:28px}
.summary b{display:block;margin-bottom:6px}
.summary ul{margin:0;padding-left:1.1em}
h2{font-size:16.5px;margin:28px 0 8px;display:flex;gap:8px}
h2 span{color:var(--accent);font-variant-numeric:tabular-nums}
p,li{margin:0 0 8px}
ul{padding-left:1.2em;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
th,td{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;width:34%}
.todo{background:var(--hl);border-radius:4px;padding:0 4px}
a{color:var(--accent)}
</style>
</head>
